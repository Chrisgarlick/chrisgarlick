<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, height=630">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0A0A0A;
    position: relative;
    font-family: 'DM Mono', monospace;
  }

  .glow {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    opacity: 0.04;
    filter: blur(150px);
    background: #E8D5A3;
    pointer-events: none;
    top: -150px;
    right: -100px;
  }

  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(240,237,232,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(240,237,232,0.015) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .content {
    position: absolute;
    top: 80px;
    left: 80px;
    right: 80px;
    bottom: 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .label {
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #E8D5A3;
    margin-bottom: 24px;
  }

  .title {
    font-family: 'Instrument Serif', serif;
    font-size: 56px;
    font-weight: 400;
    color: #F0EDE8;
    line-height: 1.1;
    max-width: 900px;
  }

  .title--large {
    font-size: 72px;
  }

  .subtitle {
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    color: #8A8580;
    margin-top: 24px;
    max-width: 700px;
    line-height: 1.5;
  }

  .brand {
    position: absolute;
    bottom: 80px;
    left: 80px;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #4A4845;
  }

  .accent-line {
    width: 48px;
    height: 2px;
    background: #E8D5A3;
    margin-bottom: 32px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="content">
    <div class="label" id="label"></div>
    <div class="accent-line"></div>
    <div class="title" id="title"></div>
    <div class="subtitle" id="subtitle"></div>
  </div>
  <div class="brand">chrisgarlick.com</div>
</body>
</html>
