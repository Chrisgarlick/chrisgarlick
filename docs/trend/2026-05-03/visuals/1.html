<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: #0A0A0A;
    }
    .container {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      font-family: 'DM Mono', monospace;
    }

    /* Subtle warm glow */
    .glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: #E8D5A3;
      filter: blur(150px);
      opacity: 0.04;
      top: -150px;
      right: -150px;
      pointer-events: none;
    }

    .glow-2 {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: #E8D5A3;
      filter: blur(120px);
      opacity: 0.03;
      bottom: -100px;
      left: -100px;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 100px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .label {
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #E8D5A3;
      margin-bottom: 48px;
    }

    .stat {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 200px;
      font-weight: 400;
      color: #F0EDE8;
      line-height: 0.85;
      margin-bottom: 32px;
    }

    .stat span {
      color: #E8D5A3;
    }

    .headline {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 42px;
      font-weight: 400;
      color: #F0EDE8;
      line-height: 1.25;
      margin-bottom: 32px;
      max-width: 700px;
    }

    .subtext {
      font-family: 'DM Mono', monospace;
      font-size: 18px;
      font-weight: 400;
      color: #8A8580;
      line-height: 1.7;
      max-width: 550px;
    }

    .source {
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      font-weight: 400;
      color: #4A4845;
      position: absolute;
      bottom: 100px;
      left: 100px;
      letter-spacing: 0.03em;
    }

    .branding {
      position: absolute;
      bottom: 100px;
      right: 100px;
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4A4845;
    }

    /* Subtle border line */
    .divider {
      width: 48px;
      height: 1px;
      background: #1A1A1A;
      margin-bottom: 32px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="glow"></div>
    <div class="glow-2"></div>

    <div class="content">
      <div class="label">AI Strategy & Adoption</div>
      <div class="stat">48<span>%</span></div>
      <div class="divider"></div>
      <div class="headline">of enterprises call AI adoption a "massive disappointment"</div>
      <div class="subtext">Up from 34% last year. The tools work. The implementation doesn't.</div>
    </div>

    <div class="source">Source: Writer 2026 (2,400 leaders)</div>
    <div class="branding">chrisgarlick.com</div>
  </div>
</body>
</html>
